---
- name: Install iptables-persistent
  apt:
    name:
      - iptables-persistent
    update_cache: yes

- name: Create config directory
  file:
    dest: /etc/iptables/
    state: directory
    mode: '0664'

- name: Deploy iptables configs
  template:
    src: "{{ item }}.j2"
    dest: /etc/iptables/{{ item }}
  loop:
    - class-a
    - class-b
    - class-c
  
- name: Apply iptables configs
  command: iptables-save > {{ item }}
