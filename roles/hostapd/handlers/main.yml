---
- name: daemon reload
  systemd:
    daemon_reload: yes
  when: "'firewall-prod' in group_names"

- name: restart hostapd-lan
  systemd:
    name: hostapd-lan.service
    state: restarted
  when: "'firewall-prod' in group_names"

- name: restart hostapd-lan2
  systemd:
    name: hostapd-lan2.service
    state: restarted
  when: "'firewall-prod' in group_names"
