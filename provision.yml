---
- name: Provision the firewall
  hosts: all
  become: yes
  remote_user: ubuntu

  tasks:
    - name: Set the hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Create my user
      user:
        name: s4228665
        append: yes
        create_home: yes
        state: present
        groups: sudo

    - name: Allow passwordless sudo
      lineinfile:
        path: /etc/sudoers.d/s4228665
        line: "s4228665 ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Deploy ssh key
      authorized_key:
        user: s4228665
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBe2NbH9tX4MVZcfKTggOt60YgtHCbn2iE4S/WjZiKJz alex@Mac.localdomain
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install kernel headers and build tools
      apt:
        name:
          - linux-headers-raspi
          - build-essential
          - dkms
          - git
          - bc
        state: present

    - name: Clone RTL8821AU WiFi driver
      git:
        repo: https://github.com/morrownr/8821au-20210708.git
        dest: /usr/src/rtl8821au-driver
        version: main
        force: yes

    - name: Install RTL8821AU driver using installation script
      shell: cd /usr/src/rtl8821au-driver && sudo ./install-driver.sh
      environment:
        SUDO_ALLOW_PASSWD_STDIN: "true"

    - name: Load 8821au kernel module
      community.general.modprobe:
        name: 8821au
        state: present

    - name: Ensure module loads on boot
      lineinfile:
        path: /etc/modules-load.d/rtl8821au.conf
        line: "8821au"
        create: yes
        mode: '0644'

    - name: Verify driver loaded
      shell: lsmod | grep 8821au
      register: driver_verify
      changed_when: false
      failed_when: driver_verify.rc != 0

    - name: Display driver status
      debug:
        msg: "RTL8821AU driver loaded successfully"
      when: driver_verify.rc == 0