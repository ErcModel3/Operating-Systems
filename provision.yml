---
- name: Provision the firewall
  hosts: all
  become: yes
  remote_user: ubuntu

  tasks:
    - name: Set the hostname
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Create my user
      user:
        name: s4228665
        append: yes
        create_home: yes
        state: present
        groups: sudo

    - name: Allow passwordless sudo
      lineinfile:
        path: /etc/sudoers.d/s4228665
        line: "s4228665 ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Deply ssh key
      authorized_key:
        user: s4228665
        key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBe2NbH9tX4MVZcfKTggOt60YgtHCbn2iE4S/WjZiKJz alex@Mac.localdomain
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install kernel headers and build tools
      apt:
        name:
          - linux-headers-raspi
          - build-essential
          - dkms
          - git
          - bc
        state: present

    - name: Clone RTL88x2BU WiFi driver
      git:
        repo: https://github.com/morrownr/88x2bu-20210702.git
        dest: /usr/src/rtl88x2bu-driver
        version: main
        force: yes

    - name: Re-gather facts after kernel headers install
      setup:

    - name: Check if RTL88x2BU driver already installed
      shell: dkms status 88x2bu/5.13.6 | grep "{{ ansible_kernel }}" | grep "installed"
      register: dkms_check
      failed_when: false
      changed_when: false

    - name: Add driver to DKMS
      command: dkms add /usr/src/rtl88x2bu-driver
      args:
        chdir: /usr/src/rtl88x2bu-driver
      when: dkms_check.rc != 0
      register: dkms_add
      failed_when:
        - dkms_add.rc != 0
        - '"already added" not in dkms_add.stderr'

    - name: Build RTL88x2BU DKMS module
      command: dkms build 88x2bu/5.13.6 -k {{ ansible_kernel }}
      when: dkms_check.rc != 0

    - name: Install RTL88x2BU DKMS module
      command: dkms install 88x2bu/5.13.6 -k {{ ansible_kernel }}
      when: dkms_check.rc != 0

    - name: Load 88x2bu kernel module
      community.general.modprobe:
        name: 88x2bu
        state: present

    - name: Ensure module loads on boot
      lineinfile:
        path: /etc/modules-load.d/rtl88x2bu.conf
        line: "88x2bu"
        create: yes
        mode: '0644'

    - name: Verify driver loaded
      shell: lsmod | grep 88x2bu
      register: driver_verify
      changed_when: false
      failed_when: driver_verify.rc != 0

    - name: Display driver status
      debug:
        msg: "RTL88x2BU driver loaded successfully"
      when: driver_verify.rc == 0